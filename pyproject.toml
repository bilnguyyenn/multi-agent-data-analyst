[project]
name = "analyst"
version = "0.1.0"
description = "Evaluated multi-agent data analyst with sandboxed execution, an analysis council, and statistical validation"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.60",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "duckdb>=1.0",
    "chromadb>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "arq>=0.26",
    "redis>=5.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
postgres = ["psycopg[binary]>=3.1"]
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
analyst = "analyst.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analyst*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
